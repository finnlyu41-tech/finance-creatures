name: Complete v0.5 release candidate
on:
  push:
    branches: ['release/v05-completion']
    paths: ['maintenance/**', '.github/workflows/complete-v05.yml']
permissions:
  contents: write
concurrency:
  group: finance-v05-preparation
  cancel-in-progress: true
jobs:
  prepare-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified source changes on release branch only
        run: python maintenance/apply-v05.py
      - name: Install pinned test dependencies
        run: |
          python -m pip install -r requirements-qa.txt
          python -m playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Fetch licensed artwork and generate QR assets
        run: python scripts/prepare-assets.py
      - name: Deterministic engine and session tests
        run: node --test tests/*.test.cjs
      - name: Full Chromium journeys and QR decoding
        env:
          QA_BROWSER: chromium
          QA_OUTPUT: qa-output/chromium
        run: python tests/browser.test.py
      - name: Full WebKit browser journeys
        env:
          QA_BROWSER: webkit
          QA_OUTPUT: qa-output/webkit
        run: python tests/browser.test.py
      - name: Commit only completed and tested source to release branch
        run: |
          git config user.name 'finance-creatures release bot'
          git config user.email '290595707+finnlyu41-tech@users.noreply.github.com'
          git add .gitignore ART-CREDITS.md README.md app.js content.js engine.js session.js index.html style.css requirements-qa.txt scripts tests assets v4.css
          git commit -m 'Complete v0.5 source, four licensed portraits, QR cards and recovery after browser verification'
          git push origin HEAD:release/v05-completion
          git rev-parse HEAD
          git archive --format=zip --output=finance-creatures-v0.5.0.zip HEAD
      - name: Preserve test evidence and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-v05-release-evidence
          path: |
            qa-output/
            finance-creatures-v0.5.0.zip
          retention-days: 14
