name: Verify quiz and live release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: finance-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser and test requirements
        run: |
          python -m pip install -r requirements-qa.txt
          python -m playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y fonts-noto-cjk
      - run: python scripts/prepare-assets.py
      - run: node --test tests/*.test.cjs
      - name: All 16 complete quiz journeys
        env:
          QA_BROWSER: ${{ matrix.browser }}
          QA_OUTPUT: qa-output/${{ matrix.browser }}
          QA_NO_PREVIEW: '1'
        run: python tests/browser.test.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: local-${{ matrix.browser }}-${{ github.run_id }}
          path: qa-output/
          retention-days: 14
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install HTTPS smoke-test browsers
        run: |
          python -m pip install -r requirements-qa.txt
          python -m playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Wait for Pages and verify exact runtime files
        run: python scripts/check-live.py
      - name: Chromium against public HTTPS
        env:
          QA_URL: https://finnlyu41-tech.github.io/finance-creatures/
          QA_BROWSER: chromium
          QA_OUTPUT: qa-output/live-chromium
          QA_SMOKE: '1'
        run: python tests/browser.test.py
      - name: WebKit against public HTTPS
        env:
          QA_URL: https://finnlyu41-tech.github.io/finance-creatures/
          QA_BROWSER: webkit
          QA_OUTPUT: qa-output/live-webkit
          QA_SMOKE: '1'
        run: python tests/browser.test.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-release-${{ github.run_id }}
          path: qa-output/
          retention-days: 14
